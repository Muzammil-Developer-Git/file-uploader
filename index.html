
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop File Uploader</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>File Uploader 📁</h1>
    <p class="subtitle">Upload your favorite images</p>

    <div id="drop-area" class="drop-area">
      <div class="upload-icon">☁️</div>
      <h2>Drag & Drop your image here</h2>
      <p>or</p>
      <label for="file-input" class="browse-btn">Browse Files</label>
      <input type="file" id="file-input"
        accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif">
      <p class="file-types">Supported: JPG, PNG, GIF</p>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="preview-section" hidden>
      <h2>Image Preview</h2>
      <img id="preview" alt="Selected image preview">

      <p id="file-name"></p>

      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
      <p id="progress-text">0%</p>

      <button id="upload-btn">Upload Image</button>
      <button id="remove-btn" class="remove-btn">Remove Image</button>
    </section>

    <section id="saved-section" hidden>
      <h2>Saved Images</h2>
      <div id="saved-images" class="saved-images"></div>
    </section>
  </main>
</body>
</html>
